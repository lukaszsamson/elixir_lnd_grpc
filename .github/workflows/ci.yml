name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29'
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-otp29-elixir1.20.4-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-otp29-elixir1.20.4-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix spec_lint
      - run: mix dialyzer --format github
